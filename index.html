<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Contador Actas">
<meta name="theme-color" content="#4f46e5">
<title>Contador Actas</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f5fb;--card:#ffffff;--text:#1b1d2a;--muted:#6b6f85;--border:#e3e5f0;
  --a1:#6366f1;--a2:#4338ca;--danger:#dc2626;--shadow:0 18px 40px -12px rgba(79,70,229,.55);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1117;--card:#1a1d29;--text:#eef0fb;--muted:#9a9fb8;--border:#2a2e40;
    --a1:#818cf8;--a2:#6366f1;--danger:#f87171;--shadow:0 18px 40px -12px rgba(99,102,241,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1117;--card:#1a1d29;--text:#eef0fb;--muted:#9a9fb8;--border:#2a2e40;
  --a1:#818cf8;--a2:#6366f1;--danger:#f87171;--shadow:0 18px 40px -12px rgba(99,102,241,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden;
}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
header{padding:18px 22px 6px;text-align:center}
header h1{margin:0;font-size:1.05rem;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* Contador */
#counter{align-items:center;justify-content:center;text-align:center;padding:0 22px;gap:2px}
.month{font-size:1.35rem;font-weight:700;letter-spacing:.08em}
.count{font-size:min(30vw,8.5rem);font-weight:800;line-height:1.05;margin-top:10px;font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.unit{font-size:1.4rem;color:var(--muted);font-weight:500}
.plus{
  margin-top:clamp(22px,5vh,44px);width:min(52vw,210px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;
  font-size:min(26vw,6.5rem);font-weight:300;line-height:1;color:#fff;
  background:linear-gradient(145deg,var(--a1),var(--a2));box-shadow:var(--shadow);
  display:grid;place-items:center;padding:0 0 .08em;transition:transform .08s ease,box-shadow .08s ease;
}
.plus:active{transform:scale(.94);box-shadow:0 8px 20px -10px rgba(79,70,229,.6)}
.minus{
  margin-top:clamp(18px,4vh,34px);background:transparent;border:1.5px solid var(--border);color:var(--text);
  font-size:1.05rem;font-weight:600;padding:12px 26px;border-radius:999px;cursor:pointer;
}
.minus:active:not(:disabled){background:var(--card)}
.minus:disabled{opacity:.35;cursor:default}

/* Meses */
#months{padding:6px 18px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:14px 16px;margin-top:10px}
.row .info{flex:1;min-width:0}
.row .name{font-weight:700;font-size:1.05rem}
.row .tot{color:var(--muted);margin-top:2px}
.badge{font-size:.8rem;font-weight:700;color:var(--a2);background:color-mix(in srgb,var(--a1) 16%,transparent);
  padding:6px 12px;border-radius:999px}
.del{background:transparent;border:1.5px solid color-mix(in srgb,var(--danger) 45%,transparent);color:var(--danger);
  font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.9rem}
.del:active{background:color-mix(in srgb,var(--danger) 12%,transparent)}
.empty{color:var(--muted);text-align:center;margin-top:40px}

/* Navegación inferior */
nav{display:flex;gap:8px;padding:10px 18px 14px;background:var(--bg)}
nav button{
  flex:1;padding:13px 0;border-radius:14px;border:0;font-size:1rem;font-weight:700;cursor:pointer;
  background:var(--card);color:var(--muted);border:1px solid var(--border);
}
nav button.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-color:transparent}

/* Diálogo */
.overlay{position:fixed;inset:0;background:rgba(10,12,22,.55);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
.overlay.on{display:flex}
.dialog{background:var(--card);color:var(--text);border-radius:22px;padding:24px;width:100%;max-width:360px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.dialog h2{margin:0 0 10px;font-size:1.2rem}
.dialog p{margin:0 0 20px;color:var(--muted);line-height:1.45}
.dialog .btns{display:flex;justify-content:flex-end;gap:10px}
.dialog button{border:0;background:transparent;font-size:1rem;font-weight:700;padding:10px 16px;border-radius:12px;cursor:pointer;color:var(--text)}
.dialog button.danger{color:#fff;background:var(--danger)}
</style>
</head>
<body>
<div id="app">
  <header><h1>Contador Actas</h1></header>
  <main>
    <section id="counter" class="screen on">
      <div class="month" id="monthName"></div>
      <div class="count" id="count">0</div>
      <div class="unit" id="unit">actas</div>
      <button class="plus" id="plus" aria-label="Sumar una acta">+</button>
      <button class="minus" id="minus">− Restar una</button>
    </section>
    <section id="months" class="screen"></section>
  </main>
  <nav>
    <button id="tabCounter" class="on">Contador</button>
    <button id="tabMonths">Meses</button>
  </nav>
</div>

<div class="overlay" id="overlay">
  <div class="dialog" role="dialog" aria-modal="true">
    <h2>Eliminar mes</h2>
    <p id="dialogText"></p>
    <div class="btns">
      <button id="cancel">Cancelar</button>
      <button id="confirm" class="danger">Eliminar</button>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY='contadorActas:v1', mem={};
  var NAMES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  function load(){
    try{
      var raw=localStorage.getItem(KEY);
      var d=raw?JSON.parse(raw):{};
      if(!d||typeof d!=='object'||Array.isArray(d)) d={};
      mem=d; return d;
    }catch(e){ return mem; }
  }
  function save(d){
    mem=d;
    try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){}
  }

  var data=load();
  var shown=null;      // mes mostrado en el contador
  var pendingDelete=null;

  function curKey(){
    var n=new Date();
    return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');
  }
  function label(key,upper){
    var p=key.split('-'), name=NAMES[parseInt(p[1],10)-1];
    return (upper?name.toUpperCase():name)+' '+p[0];
  }
  function plural(n){ return n===1?'acta':'actas'; }
  function $(id){ return document.getElementById(id); }

  // Crea el mes actual con 0 si no existe; nunca toca los anteriores.
  function ensure(){
    var k=curKey();
    if(!(k in data)){ data[k]=0; save(data); }
    return k;
  }

  function renderCounter(){
    var k=ensure(); shown=k;
    var n=data[k]||0;
    $('monthName').textContent=label(k,true);
    $('count').textContent=n;
    $('unit').textContent=plural(n);
    $('minus').disabled=n<=0;
  }

  function renderMonths(){
    var cur=ensure();
    var keys=Object.keys(data).sort().reverse();
    var box=$('months');
    if(!keys.length){ box.innerHTML='<div class="empty">Sin meses guardados</div>'; return; }
    box.innerHTML=keys.map(function(k){
      var n=data[k]||0;
      var action=k===cur?'<span class="badge">Actual</span>'
        :'<button class="del" data-key="'+k+'">Eliminar</button>';
      return '<div class="row"><div class="info"><div class="name">'+label(k)+
        '</div><div class="tot">'+n+' '+plural(n)+'</div></div>'+action+'</div>';
    }).join('');
  }

  function show(which){
    var isC=which==='counter';
    $('counter').classList.toggle('on',isC);
    $('months').classList.toggle('on',!isC);
    $('tabCounter').classList.toggle('on',isC);
    $('tabMonths').classList.toggle('on',!isC);
    if(isC) renderCounter(); else renderMonths();
  }

  $('plus').addEventListener('click',function(){
    var k=ensure();
    data[k]=(data[k]||0)+1; save(data); renderCounter();
  });
  $('minus').addEventListener('click',function(){
    var k=ensure();
    if((data[k]||0)>0){ data[k]--; save(data); renderCounter(); }
  });
  $('tabCounter').addEventListener('click',function(){ show('counter'); });
  $('tabMonths').addEventListener('click',function(){ show('months'); });

  $('months').addEventListener('click',function(e){
    var b=e.target.closest('.del'); if(!b) return;
    var k=b.getAttribute('data-key');
    if(k===curKey()) return; // mes actual protegido
    pendingDelete=k;
    $('dialogText').textContent='¿Querés eliminar '+label(k)+'? Esta acción no se puede deshacer.';
    $('overlay').classList.add('on');
  });
  function closeDialog(){ pendingDelete=null; $('overlay').classList.remove('on'); }
  $('cancel').addEventListener('click',closeDialog);
  $('overlay').addEventListener('click',function(e){ if(e.target===this) closeDialog(); });
  $('confirm').addEventListener('click',function(){
    if(pendingDelete && pendingDelete!==curKey()){
      delete data[pendingDelete]; save(data);
    }
    closeDialog(); renderMonths();
  });

  // Detecta cambio de mes con la app abierta o al volver a ella.
  function refresh(){
    data=load();
    if($('counter').classList.contains('on')) renderCounter(); else renderMonths();
  }
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) refresh(); });
  window.addEventListener('focus',refresh);
  setInterval(function(){ if(shown!==curKey()) refresh(); },30000);

  renderCounter();
})();
</script>
</body>
</html>
